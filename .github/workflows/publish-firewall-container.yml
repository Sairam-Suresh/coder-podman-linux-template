name: Build and Publish Firewall Image

on:
  push:
    branches:
      - main
    paths:
      - 'images/firewall/**'
      - '.github/workflows/publish-firewall-container.yml'
  workflow_dispatch: # Allows manual triggers

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coder-workspace-firewall

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    
      - name: Ensure lowercase owner name 
        id: lower-owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./images/firewall
          file: ./images/firewall/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower-owner.outputs.owner }}/coder-workspace-firewall:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max